spring:
  application:
    name: Software Development Document Environment
  profiles:
    active: default
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

---
spring:
  config:
    activate:
      on-profile: default
  datasource:
    url: jdbc:h2:mem:sdmedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  name: Software Development Document Environment
  version: 1.0.0
  watch-folder: ./watch_drop_folder
  storage-folder: ./sdm_storage
  templates-folder: ./sdm_templates
  auth:
    use-ldap: false
    ldap-url: ldap://localhost:389/dc=example,dc=com
  notifications:
    sms-enabled: false
    email-enabled: false
